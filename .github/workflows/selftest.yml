name: selftest

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ${{ matrix.os }}
    env:
      # selftest.sh rejects generated caches in the skill directory, so the
      # unittest step must not leave tests/__pycache__ behind.
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest has dropped Python 3.9 from its preinstalled/
          # downloadable set; pin that job to the last runner image that
          # still has it so the 3.9+ compatibility claim stays tested.
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.12"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline unit tests (oracle, fuzz, snapshots, docs)
        run: python -m unittest discover -s tests
      - name: Run offline self-test
        run: bash scripts/selftest.sh
