name: provenance

# Builds a reproducible source tarball for each tagged release and attaches
# a GitHub Artifact Attestation (keyless Sigstore signing via GitHub's OIDC
# identity). This is independent of any third-party registry's own
# verification badge — it lets anyone clone this repo, build the same
# tarball, and confirm with `gh attestation verify` or `cosign
# verify-attestation` that it was built by this repo's CI and has not been
# tampered with since. See references/supply-chain.md for how jankhunt42
# itself parses this class of evidence.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build source tarball
        run: |
          version="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="jankhunt42-${version}/" \
            -o "jankhunt42-${version}.tar.gz" HEAD

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "jankhunt42-*.tar.gz"

      # The release notes are the tag's CHANGELOG.md section; a tag without
      # one fails here rather than publishing an empty release.
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 { found = 1; next }
                               found && /^## \[/ { exit }
                               found { print }' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

      - name: Attach tarball and attestation to the GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: |
            jankhunt42-*.tar.gz
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
