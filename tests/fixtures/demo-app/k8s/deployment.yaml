apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: payments-prod
spec:
  template:
    spec:
      serviceAccountName: payments-api
      containers:
        - name: api
          image: registry.example.com/payments-api:1.0.0
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ledger-db
                  key: url
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secret-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: payments-api-secrets
subjects:
  - kind: ServiceAccount
    name: payments-api
    namespace: payments-prod
roleRef:
  kind: ClusterRole
  name: secret-reader
  apiGroup: rbac.authorization.k8s.io
